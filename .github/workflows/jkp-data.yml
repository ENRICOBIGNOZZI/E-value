name: Official JKP US monthly data
on:
  push:
    paths: ['.github/workflows/jkp-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve public research files
        run: |
          mkdir -p jkp-data
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json, datetime
          out=pathlib.Path('jkp-data'); base='https://jkpfactors-data.s3.amazonaws.com'
          urls={'availability.json':base+'/public/availability.json'}
          for theme in ('all_factors','mkt','all_themes'):
              urls[theme+'.zip']=base+'/public/%5Busa%5D_%5B'+theme+'%5D_%5Bmonthly%5D_%5Bvw_cap%5D.zip'
          manifest={'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'license':'CC BY-NC 4.0; noncommercial research only','citation':'Jensen, Kelly and Pedersen (2023), Journal of Finance 78(5), 2465-2518','files':[]}
          for name,url in urls.items():
              with urllib.request.urlopen(url,timeout=60) as r:b=r.read()
              (out/name).write_bytes(b)
              manifest['files'].append({'name':name,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              print('DOWNLOADED',name,len(b),flush=True)
          (out/'source_manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jkp-us-monthly
          path: jkp-data/
          retention-days: 7
