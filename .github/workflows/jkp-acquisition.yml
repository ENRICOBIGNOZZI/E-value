name: JKP source acquisition
on:
  push:
    paths:
      - '.github/workflows/jkp-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download public JKP source metadata
        shell: bash
        run: |
          mkdir -p jkp-source
          python - <<'PY'
          import urllib.request, urllib.parse, re, pathlib, json, hashlib
          out=pathlib.Path('jkp-source'); root='https://jkpfactors.com'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'E-value academic replication; public JKP factors'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read()
          page=get(root+'/data'); (out/'data-page.html').write_bytes(page); texts=[page.decode()]
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',texts[0])
          for i,s in enumerate(scripts):
              try:
                  b=get(urllib.parse.urljoin(root,s)); (out/f'asset-{i}.js').write_bytes(b);texts.append(b.decode())
              except Exception as e:print('ASSET_FAILURE',s,str(e))
          combined='\n'.join(texts)
          urls=sorted(set(re.findall(r'https?[^\s"<>\\]+',combined)))
          print('PUBLIC_DATA_URLS')
          for u in urls:
              if any(s in u.lower() for s in ['s3','parquet','csv','api','factor']): print(u[:500])
          print('DATA_CODE_CONTEXTS')
          for match in list(re.finditer(r'(?i)(\.csv|\.parquet|s3\.amazonaws|country_factors|/api/)',combined))[:100]:
              print(combined[max(0,match.start()-160):match.end()+240])
          (out/'urls.json').write_text(json.dumps(urls,indent=2))
          (out/'manifest.json').write_text(json.dumps({'source':root+'/data','sha256':hashlib.sha256(page).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jkp-source-discovery
          path: jkp-source/
          retention-days: 7
