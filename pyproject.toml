[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "park-revive"
version = "0.1.0"
description = "Sequential validation of estimated investment policies"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "pandas>=2.2", "pyarrow>=17", "matplotlib>=3.9", "osqp>=1.0", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
park-revive = "park_revive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
